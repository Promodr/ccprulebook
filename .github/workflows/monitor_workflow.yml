name: Check rulebooks

# Runs in GitHub's cloud, so no computer needs to be switched on.
on:
  schedule:
    - cron: "0 6 * * *"          # 06:00 UTC, every day
  workflow_dispatch:              # adds a "Run workflow" button in the Actions tab

permissions:
  contents: write                 # needed to commit the updated status file

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --quiet httpx beautifulsoup4 pymupdf

      - name: Check each clearing house
        id: check
        run: python pipeline/monitor.py data/monitor_sources.json data/monitor.json

      - name: Commit the result if anything moved
        run: |
          git config user.name  "rulebook-monitor"
          git config user.email "rulebook-monitor@users.noreply.github.com"
          git add data/monitor.json
          if git diff --staged --quiet; then
            echo "No change to record."
          else
            git commit -m "Rulebook check $(date -u +%Y-%m-%d)"
            git push
          fi
